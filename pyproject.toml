[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pixel-art-animation-studio"
version = "0.6.2"
description = "Desktop pixel-art animation tool with a plugin host, frame timeline, and onion-skin renderer."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pixel-art-animation-studio contributors" }]
keywords = ["pixel-art", "animation", "sprite", "spritesheet", "gamedev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "PySide6>=6.7,<6.9",
    "numpy>=1.26,<3.0",
    "pillow>=10.3",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]
export = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.scripts]
paas = "pixel_art_animation_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_art_animation_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pixel_art_animation_studio"]